events {}

http {
    include mime.types;

    # 1. Przekierowanie całego ruchu z niezabezpieczonego 80 na bezpieczne 443 (HTTPS)
    server {
        listen 80;
        server_name pawelcv.pl www.pawelcv.pl;
        return 301 https://$host$request_uri;
    }

    # 2. Główny, bezpieczny serwer
    server {
        listen 443 ssl;
        server_name pawelcv.pl www.pawelcv.pl;

        ssl_certificate /etc/letsencrypt/live/pawelcv.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pawelcv.pl/privkey.pem;

        location /media/ { alias /app/media/; }
        location /static/ { alias /app/static/; }

        location ~ ^/(api|admin) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
